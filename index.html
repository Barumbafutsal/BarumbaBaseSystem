<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Portal Akses Sistem</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800"
  >
    <main
      class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden"
    >
      <!-- Header Branding -->
      <div class="bg-sky-700 px-6 py-7 text-center text-white">
        <div
          class="w-20 h-20 mx-auto mb-3 bg-white rounded-2xl p-2 flex items-center justify-center shadow-md overflow-hidden"
        >
          <!-- Gambar Logo -->
          <img
            id="brandLogo"
            src="./logo.png"
            alt="Logo Instansi"
            class="w-full h-full object-contain"
            onerror="
              this.classList.add('hidden');
              document
                .getElementById('fallbackLogo')
                .classList.remove('hidden');
            "
          />
          <!-- Ikon Fallback Otomatis jika file logo belum ditemukan / salah nama -->
          <svg
            id="fallbackLogo"
            xmlns="http://www.w3.org/2000/svg"
            class="h-10 w-10 text-sky-700 hidden"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
            />
          </svg>
        </div>
        <h1 id="brandTitle" class="text-xl font-bold tracking-tight">
          Portal Sistem Informasi
        </h1>
        <p id="brandSubtitle" class="text-sky-100 text-xs mt-1">
          Silakan masuk menggunakan akun terdaftar
        </p>
      </div>

      <!-- VIEW 1: FORM LOGIN -->
      <form id="loginView" class="p-6 space-y-5">
        <div>
          <label
            for="username"
            class="block text-sm font-semibold text-slate-700 mb-1.5"
            >Username</label
          >
          <input
            type="text"
            id="username"
            required
            autocapitalize="none"
            autocomplete="username"
            placeholder="Masukkan username"
            class="w-full px-4 py-3 text-base rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-600 focus:border-sky-600 transition"
          />
        </div>

        <div>
          <label
            for="password"
            class="block text-sm font-semibold text-slate-700 mb-1.5"
            >Password</label
          >
          <div class="relative">
            <input
              type="password"
              id="password"
              required
              autocomplete="current-password"
              placeholder="Masukkan password"
              class="w-full pl-4 pr-12 py-3 text-base rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-600 focus:border-sky-600 transition"
            />
            <button
              type="button"
              id="togglePassword"
              aria-label="Tampilkan atau sembunyikan password"
              class="absolute inset-y-0 right-0 px-3.5 flex items-center text-slate-500 hover:text-slate-700 focus:outline-none"
            >
              <svg
                id="eyeOpen"
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                />
              </svg>
              <svg
                id="eyeClosed"
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 hidden"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"
                />
              </svg>
            </button>
          </div>
        </div>

        <button
          type="submit"
          id="submitBtn"
          class="w-full bg-sky-700 hover:bg-sky-800 active:bg-sky-900 text-white font-semibold py-3.5 px-4 rounded-xl shadow-sm transition text-base disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Masuk Sekarang
        </button>

        <!-- Bantuan Admin -->
        <div class="pt-2 text-center border-t border-slate-100">
          <p class="text-xs text-slate-500">
            Lupa password atau kendala akses?
            <a
              id="adminContactLink"
              href="#"
              target="_blank"
              class="text-sky-700 font-semibold hover:underline"
              >Hubungi Admin</a
            >
          </p>
        </div>
      </form>

      <!-- VIEW 2: PORTAL MULTI-LINK & LOGOUT -->
      <div id="portalView" class="hidden p-6 space-y-5">
        <div
          class="bg-slate-50 border border-slate-200 rounded-xl p-3.5 flex items-center justify-between"
        >
          <div>
            <p class="text-xs text-slate-500">Login aktif sebagai:</p>
            <p id="activeUsername" class="font-bold text-slate-800 text-sm"></p>
          </div>
          <button
            type="button"
            id="logoutBtn"
            class="text-xs font-semibold bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 px-3 py-2 rounded-lg transition"
          >
            Logout
          </button>
        </div>

        <div>
          <p class="text-sm font-semibold text-slate-700 mb-3">
            Pilih Tujuan Akses Anda:
          </p>
          <div id="linksContainer" class="space-y-2.5"></div>
        </div>
      </div>
    </main>

    <!-- POPUP MODAL NOTIFIKASI -->
    <div
      id="notifModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
      class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs transition-opacity duration-200"
    >
      <div
        id="modalCard"
        class="w-full max-w-sm bg-white rounded-2xl shadow-2xl border border-slate-200 p-6 text-center transform scale-95 opacity-0 transition-all duration-200"
      >
        <!-- Lingkaran Ikon Status -->
        <div
          id="modalIconWrapper"
          class="w-14 h-14 mx-auto mb-4 rounded-full flex items-center justify-center"
        >
          <!-- Ikon Error -->
          <svg
            id="iconError"
            xmlns="http://www.w3.org/2000/svg"
            class="h-7 w-7 text-red-600 hidden"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
            />
          </svg>
          <!-- Ikon Success -->
          <svg
            id="iconSuccess"
            xmlns="http://www.w3.org/2000/svg"
            class="h-7 w-7 text-emerald-600 hidden"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M5 13l4 4L19 7"
            />
          </svg>
          <!-- Ikon Info / Warning -->
          <svg
            id="iconInfo"
            xmlns="http://www.w3.org/2000/svg"
            class="h-7 w-7 text-sky-600 hidden"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
        </div>

        <h2 id="modalTitle" class="text-lg font-bold text-slate-800 mb-1.5">
          Pemberitahuan
        </h2>
        <p
          id="modalMessage"
          class="text-sm text-slate-600 leading-relaxed mb-6"
        ></p>

        <button
          type="button"
          id="modalCloseBtn"
          class="w-full py-3 px-4 rounded-xl font-semibold text-sm text-white bg-sky-700 hover:bg-sky-800 active:bg-sky-900 transition focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2"
        >
          Mengerti
        </button>
      </div>
    </div>

    <script>
      // ==========================================
      // KONFIGURASI SISTEM (SESUAIKAN BAGIAN INI)
      // ==========================================
      const APP_CONFIG = {
        SCRIPT_URL:
          "https://script.google.com/macros/s/GANTI_DENGAN_ID_DEPLOYMENT_ANDA/exec",
        BRAND_TITLE: "Portal Sistem Informasi",
        BRAND_SUBTITLE: "Silakan masuk menggunakan akun terdaftar",
        // Pastikan nama file & ekstensi SAMA PERSIS (huruf besar/kecil) dengan yang ada di folder Anda
        LOGO_URL: "./logo.png",
        ADMIN_WA_URL:
          "https://wa.me/6281234567890?text=Halo%20Admin,%20saya%20membutuhkan%20reset%20password%20akun%20portal.",
        MAX_ATTEMPTS: 5,
        LOCKOUT_SECONDS: 60,
      };

      // Inisialisasi Branding & Logo
      document.getElementById("brandTitle").textContent =
        APP_CONFIG.BRAND_TITLE;
      document.getElementById("brandSubtitle").textContent =
        APP_CONFIG.BRAND_SUBTITLE;
      document.getElementById("adminContactLink").href =
        APP_CONFIG.ADMIN_WA_URL;

      const brandLogo = document.getElementById("brandLogo");
      const fallbackLogo = document.getElementById("fallbackLogo");
      if (APP_CONFIG.LOGO_URL) {
        brandLogo.src = APP_CONFIG.LOGO_URL;
      }

      // Elemen DOM Utama
      const loginView = document.getElementById("loginView");
      const portalView = document.getElementById("portalView");
      const submitBtn = document.getElementById("submitBtn");
      const passwordInput = document.getElementById("password");
      const togglePasswordBtn = document.getElementById("togglePassword");
      const eyeOpen = document.getElementById("eyeOpen");
      const eyeClosed = document.getElementById("eyeClosed");

      // Elemen DOM Modal Notifikasi
      const notifModal = document.getElementById("notifModal");
      const modalCard = document.getElementById("modalCard");
      const modalIconWrapper = document.getElementById("modalIconWrapper");
      const iconError = document.getElementById("iconError");
      const iconSuccess = document.getElementById("iconSuccess");
      const iconInfo = document.getElementById("iconInfo");
      const modalTitle = document.getElementById("modalTitle");
      const modalMessage = document.getElementById("modalMessage");
      const modalCloseBtn = document.getElementById("modalCloseBtn");

      // Key Penyimpanan Lokal
      const SESSION_KEY = "portal_auth_session_v1";
      const ATTEMPT_KEY = "portal_login_attempts_v1";

      // ==========================================
      // FUNGSI POPUP MODAL NOTIFIKASI
      // ==========================================
      function showModal({
        title,
        message,
        type = "error",
        showButton = true,
      }) {
        modalTitle.textContent = title;
        modalMessage.textContent = message;

        // Reset ikon
        iconError.classList.add("hidden");
        iconSuccess.classList.add("hidden");
        iconInfo.classList.add("hidden");

        if (type === "success") {
          modalIconWrapper.className =
            "w-14 h-14 mx-auto mb-4 rounded-full flex items-center justify-center bg-emerald-100";
          iconSuccess.classList.remove("hidden");
          modalCloseBtn.className =
            "w-full py-3 px-4 rounded-xl font-semibold text-sm text-white bg-emerald-600 hover:bg-emerald-700 transition";
        } else if (type === "info") {
          modalIconWrapper.className =
            "w-14 h-14 mx-auto mb-4 rounded-full flex items-center justify-center bg-sky-100";
          iconInfo.classList.remove("hidden");
          modalCloseBtn.className =
            "w-full py-3 px-4 rounded-xl font-semibold text-sm text-white bg-sky-700 hover:bg-sky-800 transition";
        } else {
          modalIconWrapper.className =
            "w-14 h-14 mx-auto mb-4 rounded-full flex items-center justify-center bg-red-100";
          iconError.classList.remove("hidden");
          modalCloseBtn.className =
            "w-full py-3 px-4 rounded-xl font-semibold text-sm text-white bg-red-600 hover:bg-red-700 transition";
        }

        modalCloseBtn.classList.toggle("hidden", !showButton);

        // Tampilkan modal dengan animasi halus
        notifModal.classList.remove("hidden");
        notifModal.classList.add("flex");
        requestAnimationFrame(() => {
          modalCard.classList.remove("scale-95", "opacity-0");
          modalCard.classList.add("scale-100", "opacity-100");
        });

        if (showButton) {
          modalCloseBtn.focus();
        }
      }

      function closeModal() {
        modalCard.classList.remove("scale-100", "opacity-100");
        modalCard.classList.add("scale-95", "opacity-0");
        setTimeout(() => {
          notifModal.classList.add("hidden");
          notifModal.classList.remove("flex");
        }, 150);
      }

      modalCloseBtn.addEventListener("click", closeModal);
      notifModal.addEventListener("click", (e) => {
        // Tutup jika mengklik area gelap di luar kartu (kecuali saat sedang redirect)
        if (
          e.target === notifModal &&
          !modalCloseBtn.classList.contains("hidden")
        ) {
          closeModal();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (
          e.key === "Escape" &&
          !notifModal.classList.contains("hidden") &&
          !modalCloseBtn.classList.contains("hidden")
        ) {
          closeModal();
        }
      });

      // ==========================================
      // FITUR SHOW/HIDE PASSWORD
      // ==========================================
      togglePasswordBtn.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        eyeOpen.classList.toggle("hidden", isPassword);
        eyeClosed.classList.toggle("hidden", !isPassword);
      });

      // ==========================================
      // MANAJEMEN RATE LIMITING
      // ==========================================
      function checkLockout(showNotification = true) {
        const attemptData = JSON.parse(
          localStorage.getItem(ATTEMPT_KEY) || '{"count":0,"lockUntil":0}',
        );
        const now = Date.now();
        if (attemptData.lockUntil > now) {
          const remaining = Math.ceil((attemptData.lockUntil - now) / 1000);
          if (showNotification) {
            showModal({
              title: "Akses Dibatasi Sementara",
              message: `Terlalu banyak percobaan login gagal. Silakan tunggu ${remaining} detik sebelum mencoba kembali.`,
              type: "error",
            });
          }
          submitBtn.disabled = true;
          return true;
        }
        submitBtn.disabled = false;
        return false;
      }

      function recordFailedAttempt() {
        const attemptData = JSON.parse(
          localStorage.getItem(ATTEMPT_KEY) || '{"count":0,"lockUntil":0}',
        );
        attemptData.count += 1;
        if (attemptData.count >= APP_CONFIG.MAX_ATTEMPTS) {
          attemptData.lockUntil =
            Date.now() + APP_CONFIG.LOCKOUT_SECONDS * 1000;
          attemptData.count = 0;
        }
        localStorage.setItem(ATTEMPT_KEY, JSON.stringify(attemptData));
        return checkLockout(true);
      }

      function resetAttempts() {
        localStorage.removeItem(ATTEMPT_KEY);
      }

      // ==========================================
      // PENANGANAN SESI & REDIRECT OTOMATIS
      // ==========================================
      function handleSessionSuccess(sessionData, isAutoLogin = false) {
        localStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
        const links = sessionData.links || [];

        if (links.length === 1) {
          showModal({
            title: isAutoLogin ? "Sesi Aktif Ditemukan" : "Login Berhasil",
            message: "Sedang mengalihkan Anda ke halaman tujuan...",
            type: "success",
            showButton: false,
          });
          setTimeout(() => {
            window.location.href = links[0].url;
          }, 700);
          return;
        }

        // Multi-link portal
        loginView.classList.add("hidden");
        portalView.classList.remove("hidden");
        document.getElementById("activeUsername").textContent =
          sessionData.username;

        if (!isAutoLogin) {
          showModal({
            title: "Login Berhasil",
            message: `Selamat datang, ${sessionData.username}. Silakan pilih portal tujuan yang ingin Anda buka.`,
            type: "success",
          });
        }

        const container = document.getElementById("linksContainer");
        container.innerHTML = "";

        links.forEach((link) => {
          const a = document.createElement("a");
          a.href = link.url;
          a.className =
            "flex items-center justify-between w-full p-4 bg-sky-50 hover:bg-sky-100 border border-sky-200 rounded-xl text-sky-900 font-semibold text-sm transition";
          a.innerHTML = `
          <span>${link.label}</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-sky-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        `;
          container.appendChild(a);
        });
      }

      // Cek sesi saat halaman dimuat
      window.addEventListener("DOMContentLoaded", () => {
        checkLockout(false);
        const savedSession = localStorage.getItem(SESSION_KEY);
        if (savedSession) {
          try {
            const parsed = JSON.parse(savedSession);
            if (parsed && parsed.links && parsed.links.length > 0) {
              handleSessionSuccess(parsed, true);
            }
          } catch (e) {
            localStorage.removeItem(SESSION_KEY);
          }
        }
      });

      // Proses Submit Login
      loginView.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (checkLockout(true)) return;

        const username = document.getElementById("username").value;
        const password = passwordInput.value;

        submitBtn.disabled = true;
        submitBtn.textContent = "Memverifikasi...";

        try {
          const res = await fetch(APP_CONFIG.SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ username, password }),
          });

          const data = await res.json();

          if (data.status === "success") {
            resetAttempts();
            handleSessionSuccess(
              { username: data.username, links: data.links },
              false,
            );
          } else {
            const isLocked = recordFailedAttempt();
            if (!isLocked) {
              showModal({
                title: "Login Gagal",
                message:
                  data.message ||
                  "Username atau password yang Anda masukkan salah.",
                type: "error",
              });
            }
          }
        } catch (err) {
          showModal({
            title: "Koneksi Bermasalah",
            message:
              "Gagal terhubung ke server database. Pastikan koneksi internet stabil dan URL Apps Script sudah benar.",
            type: "error",
          });
        } finally {
          if (!checkLockout(false)) {
            submitBtn.disabled = false;
          }
          submitBtn.textContent = "Masuk Sekarang";
        }
      });

      // Tombol Logout
      document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem(SESSION_KEY);
        portalView.classList.add("hidden");
        loginView.classList.remove("hidden");
        loginView.reset();
        showModal({
          title: "Berhasil Logout",
          message: "Sesi Anda telah diakhiri dengan aman.",
          type: "info",
        });
      });
    </script>
  </body>
</html>
